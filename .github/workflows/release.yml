name: Release

# Builds the Windows package and publishes a GitHub Release when a vX.Y.Z tag is pushed.
# The NIMVORO launcher downloads FpsOverlay-win-x64.zip from the release (name set in nimvoro.json).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the tag
        shell: pwsh
        run: |
          $v = ([xml](Get-Content FpsOverlay.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$v" >> $env:GITHUB_ENV
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match version $v"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Self-contained: users do not need to install .NET 8 separately.
      - name: Build
        run: dotnet publish FpsOverlay.csproj -c Release -r win-x64 --self-contained true -o pkg

      - name: Package
        shell: pwsh
        run: |
          Remove-Item pkg/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path pkg/* -DestinationPath FpsOverlay-win-x64.zip -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = "v$env:VERSION" }
          gh release create $tag "FpsOverlay-win-x64.zip" --title "FPS Overlay $tag" --generate-notes --verify-tag
